[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pmc-pair"
version = "1.3.0rc1"
description = "PMC-PaIR dataset construction pipeline (CHIPA: citation-guided hierarchical image-pair annotation)"
authors = [
    {name = "Guy Shmueli"},
    {name = "Tom Hope"},
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "json-repair==0.64.0",
    "lxml>=5.0",
    "Pillow>=10.1",
    "pytesseract>=0.3.10",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
llm = ["openai>=2.0"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["pmc_pair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
